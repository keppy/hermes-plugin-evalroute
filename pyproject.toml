# Hermes reads [project].dependencies from this file and installs them into
# its own venv. The plugin is a thin adapter: every behaviour lives in the
# `evalroute` library (PyPI), which brings pyyaml with it, so the plugin
# declares no dependency of its own beyond the library pin. Strong rules run
# locally inside the library; weak-signal routing invokes ctx.llm (token
# cost). The separately invoked harness/shim can call paid providers; they
# do not run on plugin import or as a side effect of installing the plugin.

[project]
name = "hermes-plugin-evalroute"
version = "0.6.1"
description = "Hermes plugin: route tasks to the right (model, reasoning effort) arm, from a measured cost-per-verified-success table."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "James Dominguez" }]
keywords = ["hermes", "plugin", "model-routing", "evals", "reasoning-effort"]

dependencies = [
  "evalroute>=0.8,<0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/keppy/hermes-plugin-evalroute"
Source = "https://github.com/keppy/hermes-plugin-evalroute"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Draft of the plugin-catalog/evalroute.yaml entry (not yet submitted to
# NousResearch/hermes-agent). Kept here so the reviewed pin sits next to the
# code it pins; the copy in plugin-catalog/ is the one that installs.
# `sha` still points at the last tagged release; re-pin it with
# `git rev-parse v<version>^{commit}` in the commit after tagging, never by hand.
name: evalroute
repo: https://github.com/keppy/hermes-plugin-evalroute
sha: ca5942642cc3c6cc877fa6d835d7a259394ceed1
description: Route a task to the right (model, reasoning effort) arm before you start.
  Classifies the task into a lane, prints a provenance-carrying route card, and installs
  per-model reasoning-effort defaults. Strong rules run locally; weak-signal
  classification calls the host LLM and consumes tokens. The separate harness
  and shim can make paid provider calls when explicitly run; no plugin-owned credentials.
maintainer: keppy
tier: community
category: tools
requires_hermes: ">=0.21"
version: "0.5.0"
docs_url: https://github.com/keppy/hermes-plugin-evalroute#readme
capabilities:
  provides_tools:
    - evalroute_route
  provides_hooks:
    - pre_llm_call
    - pre_command
    - post_llm_call
  provides_middleware: []
  requires_env: []

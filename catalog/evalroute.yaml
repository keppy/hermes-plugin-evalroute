# Submitted to NousResearch/hermes-agent as plugin-catalog/evalroute.yaml.
# Kept here so the reviewed pin sits next to the code it pins; the copy in
# plugin-catalog/ is the one that installs.
name: evalroute
repo: https://github.com/keppy/hermes-plugin-evalroute
sha: b45f1362b1de2813087fd8f7f3d8bf34e1e64abc
description: Route a task to the right (model, reasoning effort) arm before you start.
  Classifies the task into a lane, prints a provenance-carrying route card, and installs
  per-model reasoning-effort defaults so /model carries the lane's effort. Local only -
  no network, no credentials, nothing paid.
maintainer: keppy
tier: community
category: tools
requires_hermes: ">=0.21"
version: "0.3.2"
docs_url: https://github.com/keppy/hermes-plugin-evalroute#readme
capabilities:
  provides_tools:
    - evalroute_route
  provides_hooks:
    - pre_llm_call
    - pre_command
    - post_llm_call
  provides_middleware: []
  requires_env: []

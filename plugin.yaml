name: evalroute
version: "0.6.0"
manifest_version: 2
api_version: 1
description: >-
  Route a task to a (model, effort) arm with provenance. Strong keyword
  classification runs locally; weak tasks may use the host LLM and consume
  tokens. Per-model effort defaults are installed, but a card names the
  lane's exact effort when a shared model needs a different setting.
author: James Dominguez (keppy)
license: MIT
homepage: https://github.com/keppy/hermes-plugin-evalroute
tags: [evals, model-routing, reasoning-effort, cost-per-success]
provides_tools:
  - evalroute_route
provides_hooks:
  - pre_llm_call
  - pre_command
  - post_llm_call
